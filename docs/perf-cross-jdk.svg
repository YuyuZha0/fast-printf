  <path d="M 241.92 139 H 245.07 M 241.92 135 V 143 M 245.07 135 V 143" stroke="#0f172a" fill="none"/>
  <text x="255.07" y="144" font-size="13" fill="#0f172a">160</text>
  <rect x="112" y="155" width="518.39" height="18" rx="3" fill="#64748b"/>
  <path d="M 624.55 164 H 636.24 M 624.55 160 V 168 M 636.24 160 V 168" stroke="#0f172a" fill="none"/>
  <text x="646.24" y="169" font-size="13" fill="#0f172a">632</text>
  <text x="738" y="157" font-size="15" font-weight="600" fill="#0f766e">3.9× faster</text>
