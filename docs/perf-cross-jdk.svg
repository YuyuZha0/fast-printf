<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="chart-title">Repeated formatting across JDKs</title>
  <desc id="chart-desc">Average time per log line, lower is better. fast-printf versus String.format: JDK 8, 160 versus 632 ns; JDK 11, 137 versus 600 ns; JDK 17, 135 versus 324 ns; JDK 21, 138 versus 265 ns. Error bars show JMH's reported confidence intervals. Measured from commit 0ebd03d using CommonUsageBenchmark on macOS ARM64, Corretto, JMH 1.37, two forks, three one-second warmups and four one-second measurements, full blackhole mode, 256 MB heap, English/US locale.</desc>
  <rect width="860" height="480" rx="12" fill="#f8fafc"/>
  <text x="32" y="38" font-size="23" font-weight="700" fill="#0f172a">Repeated formatting across JDKs</text>
  <text x="32" y="64" font-size="14" fill="#475569">Time per log line · ns/op · lower is better</text>
  <rect x="32" y="84" width="14" height="14" rx="3" fill="#0f766e"/>
  <text x="54" y="96" font-size="14" fill="#334155">fast-printf (varargs)</text>
  <rect x="240" y="84" width="14" height="14" rx="3" fill="#64748b"/>
  <text x="262" y="96" font-size="14" fill="#334155">String.format</text>
  <line x1="112.0" y1="119" x2="112.0" y2="393" stroke="#e2e8f0"/>
  <text x="112.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">0</text>
  <line x1="194.0" y1="119" x2="194.0" y2="393" stroke="#e2e8f0"/>
  <text x="194.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">100</text>
  <line x1="276.0" y1="119" x2="276.0" y2="393" stroke="#e2e8f0"/>
  <text x="276.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">200</text>
  <line x1="358.0" y1="119" x2="358.0" y2="393" stroke="#e2e8f0"/>
  <text x="358.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">300</text>
  <line x1="440.0" y1="119" x2="440.0" y2="393" stroke="#e2e8f0"/>
  <text x="440.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">400</text>
  <line x1="522.0" y1="119" x2="522.0" y2="393" stroke="#e2e8f0"/>
  <text x="522.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">500</text>
  <line x1="604.0" y1="119" x2="604.0" y2="393" stroke="#e2e8f0"/>
  <text x="604.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">600</text>
  <line x1="686.0" y1="119" x2="686.0" y2="393" stroke="#e2e8f0"/>
  <text x="686.0" y="414" text-anchor="middle" font-size="12" fill="#64748b">700</text>
  <text x="32" y="157" font-size="15" font-weight="600" fill="#334155">JDK 8</text>
