name: Performance benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        java: [8, 21]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Run JMH without coverage instrumentation
        run: |
          mvn -B -ntp test-compile dependency:build-classpath \
            -DskipTests -Djacoco.skip=true -DincludeScope=test \
            -Dmdep.outputFile=target/benchmark-classpath.txt
          java -cp "target/classes:target/test-classes:$(cat target/benchmark-classpath.txt)" \
            org.openjdk.jmh.Main 'FormattingPipelineBenchmark|DispatchBenchmark|CommonUsageBenchmark' \
            -wi 3 -i 5 -w 1s -r 1s -f 2 -prof gc \
            -jvmArgs '-Xms256m -Xmx256m' -rf json -rff target/benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-jdk-${{ matrix.java }}
          path: target/benchmark.json
          if-no-files-found: error
          retention-days: 30
