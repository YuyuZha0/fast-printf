name: Release to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_tag:
        description: 'Existing release tag (e.g., v1.2.14)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.git_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.git_tag || github.event.release.tag_name }}
      - name: Set up JDK 21, signing and Maven credentials
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
      # Maven 3.10.0 leaves maven-metadata-local.xml in the publishing plugin's bundle.
      # Central rejects that artifact-level metadata as content without a POM.
      - name: Set up Maven 3.9.16 for publishing
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: '3.9.16'
      - name: Check tag against Maven version
        env:
          RELEASE_TAG: ${{ github.event.inputs.git_tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mvn -B -ntp help:evaluate -Dexpression=project.version -Doutput=release-version.txt
          VERSION=$(cat release-version.txt)
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
      - name: Verify release signing key
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -ntp help:evaluate -Dexpression=gpg.keyname \
            -Doutput="$RUNNER_TEMP/release-gpg-key.txt"
          SIGNING_KEY=$(cat "$RUNNER_TEMP/release-gpg-key.txt")
          printf '%s\n' 'fast-printf release signing check' > "$RUNNER_TEMP/signing-check.txt"
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$SIGNING_KEY" --armor --detach-sign \
            --output "$RUNNER_TEMP/signing-check.asc" "$RUNNER_TEMP/signing-check.txt" \
            <<< "$GPG_PASSPHRASE"; then
            echo '::error::Release signing failed. Check key/subkey expiry and signing capability, renew or replace the key, and update GPG_PRIVATE_KEY and GPG_PASSPHRASE.'
            gpg --batch --list-keys "$SIGNING_KEY"
            exit 1
          fi
      - name: Verify, sign and publish
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: mvn -B -ntp clean verify central-publishing:publish -Prelease
